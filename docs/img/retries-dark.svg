<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" role="img" aria-label="Hakai malware makes one connection attempt every 80 seconds to a server that never answers; the operating system retries each one, and Zeek logs the retries as separate connections 7, 8, 17 and 48 seconds apart" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><rect width="760" height="404" rx="10" fill="#1a1a19"/><text x="28.0" y="40.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">Problem 2: a dead server scrambles the timer in the log</text><text x="28.0" y="63.0" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Real traffic: Hakai malware calling its command server, which never answers (IoT-23 capture 8-1).</text><text x="28.0" y="137.0" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">What the malware does</text><text x="28.0" y="155.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">one attempt every 80 s</text><line x1="196.0" y1="154.0" x2="724.0" y2="154.0" stroke="#4a4a46" stroke-width="1" stroke-linecap="butt"/><line x1="196.0" y1="124.0" x2="196.0" y2="154.0" stroke="#3987e5" stroke-width="2.5" stroke-linecap="round"/><line x1="199.3" y1="142.0" x2="199.3" y2="154.0" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><line x1="206.2" y1="142.0" x2="206.2" y2="154.0" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><line x1="219.6" y1="142.0" x2="219.6" y2="154.0" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><line x1="246.5" y1="142.0" x2="246.5" y2="154.0" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><line x1="301.4" y1="142.0" x2="301.4" y2="154.0" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><line x1="460.0" y1="124.0" x2="460.0" y2="154.0" stroke="#3987e5" stroke-width="2.5" stroke-linecap="round"/><line x1="463.4" y1="142.0" x2="463.4" y2="154.0" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><line x1="470.2" y1="142.0" x2="470.2" y2="154.0" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><line x1="483.7" y1="142.0" x2="483.7" y2="154.0" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><line x1="510.3" y1="142.0" x2="510.3" y2="154.0" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><line x1="565.2" y1="142.0" x2="565.2" y2="154.0" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><path d="M196.0,119.0 V114.0 H460.0 V119.0" fill="none" stroke="#898781" stroke-width="1"/><text x="328.0" y="107.0" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">80 s</text><text x="202.0" y="172.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">short marks: the OS re-sending the unanswered request (1, 3, 7, 15, 31 s)</text><text x="28.0" y="247.0" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">What Zeek&#x27;s log records</text><text x="28.0" y="265.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">4 &quot;connections&quot; per attempt</text><line x1="196.0" y1="264.0" x2="724.0" y2="264.0" stroke="#4a4a46" stroke-width="1" stroke-linecap="butt"/><line x1="196.0" y1="236.0" x2="196.0" y2="264.0" stroke="#898781" stroke-width="2.5" stroke-linecap="round"/><line x1="219.6" y1="236.0" x2="219.6" y2="264.0" stroke="#898781" stroke-width="2.5" stroke-linecap="round"/><line x1="246.5" y1="236.0" x2="246.5" y2="264.0" stroke="#898781" stroke-width="2.5" stroke-linecap="round"/><line x1="301.4" y1="236.0" x2="301.4" y2="264.0" stroke="#898781" stroke-width="2.5" stroke-linecap="round"/><line x1="460.0" y1="236.0" x2="460.0" y2="264.0" stroke="#898781" stroke-width="2.5" stroke-linecap="round"/><line x1="483.7" y1="236.0" x2="483.7" y2="264.0" stroke="#898781" stroke-width="2.5" stroke-linecap="round"/><line x1="510.3" y1="236.0" x2="510.3" y2="264.0" stroke="#898781" stroke-width="2.5" stroke-linecap="round"/><line x1="565.2" y1="236.0" x2="565.2" y2="264.0" stroke="#898781" stroke-width="2.5" stroke-linecap="round"/><line x1="724.0" y1="236.0" x2="724.0" y2="264.0" stroke="#898781" stroke-width="2.5" stroke-linecap="round"/><text x="207.8" y="284.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">7s</text><text x="233.1" y="284.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">8s</text><text x="274.0" y="284.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">17s</text><text x="380.7" y="284.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">48s</text><text x="471.8" y="284.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">7s</text><text x="497.0" y="284.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">8s</text><text x="537.8" y="284.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">17s</text><text x="644.6" y="284.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">48s</text><circle cx="36.0" cy="324.0" r="8" fill="#d03b3b"/><path d="M33.0,321.0 l6,6 M39.0,321.0 l-6,6" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/><text x="52.0" y="328.5" font-size="13" fill="#c3c2b7"><tspan font-weight="600" fill="#ffffff">Standard check on the log:</tspan> gaps of 7, 8, 17, 48 s look irregular. Score 0.65, not flagged.</text><circle cx="36.0" cy="358.0" r="8" fill="#0ca30c"/><path d="M32.4,358.0 l2.4,2.6 l4.8,-5.2" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="52.0" y="362.5" font-size="13" fill="#c3c2b7"><tspan font-weight="600" fill="#ffffff">beacon-hunter:</tspan> retries keep the same source port, so they count once. Every 80 s: score 1.00.</text></svg>
