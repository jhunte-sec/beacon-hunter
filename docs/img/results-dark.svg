<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="Real command-and-control traffic from IoT-23: the standard method misses the Mirai and Hakai channels, beacon-hunter flags both; Torii and a one-off download stay unflagged" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><rect width="760" height="450" rx="10" fill="#1a1a19"/><text x="28.0" y="40.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">Tested on real malware traffic</text><text x="28.0" y="63.0" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">How regular each command-and-control channel looks, from 0 (random) to 1 (clockwork).</text><rect x="463.2" y="114" width="66.8" height="262" rx="4" fill="#17304d"/><text x="496.6" y="106.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">flagged as a beacon</text><line x1="236.0" y1="114.0" x2="236.0" y2="376.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/><text x="236.0" y="394.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">0 · random</text><line x1="378.0" y1="114.0" x2="378.0" y2="376.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/><text x="378.0" y="394.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">0.5</text><line x1="520.0" y1="114.0" x2="520.0" y2="376.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/><text x="520.0" y="394.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">1 · clockwork</text><circle cx="34.0" cy="92.0" r="6" fill="#898781" stroke="#1a1a19" stroke-width="2"/><text x="47.0" y="96.5" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">standard method</text><circle cx="176.0" cy="92.0" r="6" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="189.0" y="96.5" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">beacon-hunter</text><text x="28.0" y="144.0" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">Mirai botnet</text><text x="28.0" y="162.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">IRC command channel</text><line x1="344.4" y1="140.0" x2="509.8" y2="140.0" stroke="#898781" stroke-width="1.5" stroke-linecap="butt"/><path d="M503.8,135.5 L510.8,140.0 L503.8,144.5" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/><circle cx="336.4" cy="140.0" r="6" fill="#898781" stroke="#1a1a19" stroke-width="2"/><circle cx="519.8" cy="140.0" r="6" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="552.0" y="144.0" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Caught.</text><text x="552.0" y="162.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">Alternates 3 s and 7 s waits.</text><text x="28.0" y="206.0" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">Hakai botnet</text><text x="28.0" y="224.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">2 command servers</text><line x1="430.7" y1="202.0" x2="509.3" y2="202.0" stroke="#898781" stroke-width="1.5" stroke-linecap="butt"/><path d="M503.3,197.5 L510.3,202.0 L503.3,206.5" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/><circle cx="422.7" cy="202.0" r="6" fill="#898781" stroke="#1a1a19" stroke-width="2"/><circle cx="519.3" cy="202.0" r="6" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="552.0" y="206.0" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="start">Caught.</text><text x="552.0" y="224.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">Repeats a 4-step, 80 s loop.</text><text x="28.0" y="268.0" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">Torii botnet</text><text x="28.0" y="286.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">command server, 2 captures</text><circle cx="411.3" cy="264.0" r="6" fill="#898781" stroke="#1a1a19" stroke-width="2"/><circle cx="411.3" cy="264.0" r="6" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="552.0" y="268.0" font-size="13.5" font-weight="600" fill="#c3c2b7" text-anchor="start">Not flagged.</text><text x="552.0" y="286.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">~15 connections, bursts hours apart.</text><text x="28.0" y="330.0" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">Mirai botnet</text><text x="28.0" y="348.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">malware download</text><circle cx="315.5" cy="326.0" r="6" fill="#898781" stroke="#1a1a19" stroke-width="2"/><circle cx="341.3" cy="326.0" r="6" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="552.0" y="330.0" font-size="13.5" font-weight="600" fill="#c3c2b7" text-anchor="start">Not a beacon.</text><text x="552.0" y="348.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">One burst of downloads.</text><text x="28.0" y="428.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">Not shown: 7 more C&amp;C connections were one-off downloads or single long sessions. No timing method can see those.</text></svg>
