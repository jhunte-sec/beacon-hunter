<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 354" width="760" height="354" role="img" aria-label="Line charts: detection rate of simulated beacons as missed check-ins rise, beacon-hunter versus plain scoring, at three jitter levels">
<style>
