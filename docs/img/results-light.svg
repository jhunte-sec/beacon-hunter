<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="760" height="388" role="img" aria-label="Real command-and-control traffic from IoT-23: the standard method misses the Mirai and Hakai channels, beacon-hunter flags both; a one-off download stays unflagged" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><rect width="760" height="388" rx="10" fill="#fcfcfb"/><text x="28.0" y="40.0" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">Tested on real malware traffic</text><text x="28.0" y="63.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">How regular each command-and-control channel looks, from 0 (random) to 1 (clockwork).</text><rect x="463.2" y="114" width="66.8" height="200" rx="4" fill="#dbe9fa"/><text x="496.6" y="106.0" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">flagged as a beacon</text><line x1="236.0" y1="114.0" x2="236.0" y2="314.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt"/><text x="236.0" y="332.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">0 · random</text><line x1="378.0" y1="114.0" x2="378.0" y2="314.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt"/><text x="378.0" y="332.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">0.5</text><line x1="520.0" y1="114.0" x2="520.0" y2="314.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt"/><text x="520.0" y="332.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">1 · clockwork</text><circle cx="34.0" cy="92.0" r="6" fill="#898781" stroke="#fcfcfb" stroke-width="2"/><text x="47.0" y="96.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">standard method</text><circle cx="176.0" cy="92.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="189.0" y="96.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">beacon-hunter</text><text x="28.0" y="144.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">Mirai botnet</text><text x="28.0" y="162.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">IRC command channel</text><line x1="344.4" y1="140.0" x2="509.5" y2="140.0" stroke="#898781" stroke-width="1.5" stroke-linecap="butt"/><path d="M503.5,135.5 L510.5,140.0 L503.5,144.5" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/><circle cx="336.4" cy="140.0" r="6" fill="#898781" stroke="#fcfcfb" stroke-width="2"/><circle cx="519.5" cy="140.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="552.0" y="144.0" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Caught.</text><text x="552.0" y="162.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">Tries every 10 s; rarely answered.</text><text x="28.0" y="206.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">Hakai botnet</text><text x="28.0" y="224.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">2 command servers</text><line x1="430.7" y1="202.0" x2="510.0" y2="202.0" stroke="#898781" stroke-width="1.5" stroke-linecap="butt"/><path d="M504.0,197.5 L511.0,202.0 L504.0,206.5" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/><circle cx="422.7" cy="202.0" r="6" fill="#898781" stroke="#fcfcfb" stroke-width="2"/><circle cx="520.0" cy="202.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="552.0" y="206.0" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Caught.</text><text x="552.0" y="224.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">Tries every 80 s; never answered.</text><text x="28.0" y="268.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">Mirai botnet</text><text x="28.0" y="286.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">malware download</text><line x1="323.5" y1="264.0" x2="393.5" y2="264.0" stroke="#898781" stroke-width="1.5" stroke-linecap="butt"/><path d="M387.5,259.5 L394.5,264.0 L387.5,268.5" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/><circle cx="315.5" cy="264.0" r="6" fill="#898781" stroke="#fcfcfb" stroke-width="2"/><circle cx="403.5" cy="264.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="552.0" y="268.0" font-size="13.5" font-weight="600" fill="#52514e" text-anchor="start">Not a beacon.</text><text x="552.0" y="286.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">One burst of downloads.</text><text x="28.0" y="366.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">Not shown: 9 more C&amp;C channels had too few attempts to judge (one-off downloads, single long sessions, Torii&#x27;s handful of tries).</text></svg>
