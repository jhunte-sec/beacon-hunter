[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-hunter"
version = "0.1.0"
description = "Find C2 beaconing in Zeek conn.log files"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jason Hunte" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
beacon-hunter = "beacon_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
